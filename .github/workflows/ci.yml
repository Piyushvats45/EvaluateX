name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal (CI-safe) dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-minimal.txt
          pip install pytest

      - name: Run test suite (mock backend — no model downloads needed)
        run: pytest tests/ -v

      - name: Smoke-test the CLI end-to-end (mock backend — no downloads)
        run: python run_experiment.py --name ci-smoke-test --candidates 1 --models config/models.mock.yaml
